name: Deploy rebuild-v1 to GitHub Pages

# Publie uniquement depuis rebuild-v1 (jamais main), tant que la migration
# SEO n'est pas validée : voir docs/migration-seo/migration-seo-brief-claude.md.
# Domaine personnalisé lesgrandsraidsaski.com branché côté GitHub Pages
# (hors dépôt, DNS/CDN) ; le build ici tourne donc avec BASE_PATH=/ pour
# servir le site à la racine du domaine.
on:
  push:
    branches: [rebuild-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
